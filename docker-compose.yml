version: '3.8'

services:
  # Landslide & Flood AI Prediction Engine
  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: sih-ml-service
    ports:
      - "8000:8000"
    restart: unless-stopped
    networks:
      - sih-network

  # Backend Gateway & Routing Engine
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sih-backend
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - ML_SERVICE_URL=http://ml-service:8000
      - NEO4J_URI=neo4j://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=sih_password
      - MONGO_URI=mongodb://root:root_password@mongodb:27017/sih_db?authSource=admin
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=sih_user
      - POSTGRES_PASSWORD=sih_password
      - POSTGRES_DB=sih_db
      - REDIS_URL=redis://redis:6379
      - TRACCAR_URL=https://demo4.traccar.org
      - TRACCAR_TOKEN=RzBFAiEAmkBE6qFT33LTHdzCFYUo5tTtxiSd4ponJF0aiWd1M_UCIEbSxaZOq2rbmz-k5klbbHL6I4DTEblpu75P7pTCCQt7eyJpIjo2MjUwMTM5MTYwODQ0MTI0MDI1LCJ1Ijo1NDg5MCwiZSI6IjIwMjYtMDktMTFUMTg6MzA6MDAuMDAwKzAwOjAwIn0
    depends_on:
      - ml-service
      - neo4j
      - postgres
      - mongodb
      - redis
    restart: unless-stopped
    networks:
      - sih-network

  # Next.js Command Dashboard & Incident Reporter
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=AIzaSyDkis0HFmgKNF_RuBS6rHZz-aUxVkqUyd4
    container_name: sih-frontend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - sih-network

  # PostgreSQL with PostGIS for spatial queries and relational data
  postgres:
    image: postgis/postgis:15-3.3
    container_name: sih-postgres
    environment:
      POSTGRES_USER: sih_user
      POSTGRES_PASSWORD: sih_password
      POSTGRES_DB: sih_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - sih-network

  # Neo4j for graph-based route calculation
  neo4j:
    image: neo4j:5.26.0
    container_name: sih-neo4j
    environment:
      NEO4J_AUTH: neo4j/sih_password
      # Needs APOC for graph algorithms (like Dijkstra)
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
    ports:
      - "7474:7474" # HTTP
      - "7687:7687" # Bolt
    volumes:
      - neo4j_data:/data
    restart: unless-stopped
    networks:
      - sih-network

  # MongoDB for unstructured field reports and images
  mongodb:
    image: mongo:6
    container_name: sih-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: root_password
    ports:
      - "27018:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped
    networks:
      - sih-network

  # Redis for caching live locations and weather API responses
  redis:
    image: redis:7-alpine
    container_name: sih-redis
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - sih-network

networks:
  sih-network:
    driver: bridge

volumes:
  postgres_data:
  neo4j_data:
  mongodb_data:
  redis_data:
